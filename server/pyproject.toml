[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-voice-activator"
version = "1.0.0"
description = "Host relay, ASR service and telemetry protocol for the Edge Voice Activator"
requires-python = ">=3.10"
dependencies = [
  "websockets>=12.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
asr = ["av>=11.0", "faster-whisper>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
edge-voice = "edge_voice.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
