[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:edge_voice.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["server/src", "server/tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "D"]
ignore = [
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
  "ANN401",  # `Any` is deliberate at the untyped WS frame boundary
]

[tool.ruff.lint.per-file-ignores]
"server/tests/*" = ["D100", "D103", "ANN201", "ANN001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.10"
mypy_path = "server/src"
packages = ["edge_voice"]
strict = true
warn_unreachable = true
disallow_any_explicit = false
